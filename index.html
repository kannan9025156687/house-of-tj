<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>House of TJ Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&family=Kaushan+Script&family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
/* Layout: mobile-first single column menu. Brand header, sticky search + category chips, item rows with steppers, bottom cart bar opening an order sheet. */
:root{
  --bg:#FBF7F0; --surface:#FFFFFF; --ink:#1E120C; --muted:#5E4B3F; --line:#DCCFC2; color-scheme:light;
  --gold:#3B2314; --gold-ink:#FFF4E6; --chip:#F1E8DC;
  --veg:#1B7F3A; --nonveg:#C62828; --egg:#B45309;
  --font-display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --font-script:"Kaushan Script","Brush Script MT",cursive;
  --font-body:"DM Sans","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 8px 28px rgba(60,35,20,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:680px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{display:flex;justify-content:flex-end;gap:8px;padding-top:12px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;min-height:36px}
.pill[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

.brand{text-align:center;padding:8px 0 18px}
.brand svg{width:96px;height:auto;display:block;margin:0 auto 6px}
.brand h1{font-family:var(--font-display);font-size:34px;line-height:1;letter-spacing:.12em;margin:0;color:var(--gold);text-wrap:balance}
.brand .sub{letter-spacing:.32em;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.brand .script{font-family:var(--font-script);font-size:26px;margin-top:10px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.brand .script span:last-child{color:var(--muted)}
.mark{background:var(--gold);color:var(--gold-ink);padding:0 10px}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-inline:-4px;padding-inline:4px}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;white-space:nowrap}
.chip[aria-current="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.diet{display:flex;gap:8px;padding-top:10px;flex-wrap:wrap}
.diet .pill{font-size:13px;padding:4px 12px;min-height:32px;display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border:2px solid currentColor;border-radius:3px;display:inline-grid;place-items:center;flex:0 0 auto}
.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.dot.veg{color:var(--veg)}.dot.nonveg{color:var(--nonveg)}.dot.egg{color:var(--egg)}

section.cat{padding-top:22px;scroll-margin-top:150px}
section.cat h2{font-family:var(--font-display);font-size:22px;font-weight:400;margin:0 0 6px;display:inline-block;background:var(--gold);color:var(--gold-ink);padding:4px 14px 3px;transform:skew(-6deg);letter-spacing:.02em}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:13px 0;border-bottom:1px dashed var(--line)}
.item .name{display:flex;gap:8px;align-items:center;font-weight:700;font-size:17px;min-width:0}
.item .name span.t{min-width:0}
.item .note{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.item .alt{grid-column:1;font-size:13px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;background:var(--gold);color:var(--gold-ink);border-radius:6px;padding:1px 7px;margin-left:4px}
.right{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.price{font-family:var(--font-display);font-size:19px;font-variant-numeric:tabular-nums;color:var(--gold)}
.add{border:2px solid var(--gold);background:transparent;color:var(--ink);font-weight:700;border-radius:10px;padding:5px 18px;min-height:36px;font-size:14px;letter-spacing:.04em}
.add:active{background:var(--gold)}
.step{display:flex;align-items:center;background:var(--gold);color:var(--gold-ink);border-radius:10px;overflow:hidden}
.step button{background:none;border:0;width:36px;height:36px;font-size:20px;font-weight:700;color:var(--gold-ink)}
.step b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.ban{display:block;width:100%;height:auto;aspect-ratio:720/327;margin:8px 0 2px}
.svc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.svc a{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 18px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:15px}
.svc p{width:100%;text-align:center;font-size:12px;color:var(--muted)}
.tb{display:inline-block;margin-top:12px;background:var(--gold);color:var(--gold-ink);font-family:var(--font-display);padding:6px 20px;border-radius:999px;letter-spacing:.08em}
.tbl{padding:10px 14px;border:1.5px solid var(--gold);border-radius:12px;margin-bottom:12px;font-size:17px}
.tbl b{color:var(--gold);font-family:var(--font-display)}
.foot{text-align:center;padding:34px 0 10px;color:var(--muted)}
.foot .script{font-family:var(--font-script);font-size:24px;color:var(--ink)}
.foot small{display:block;margin-top:8px;font-size:12px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.bar button{pointer-events:auto;display:flex;width:100%;max-width:680px;margin:0 auto;justify-content:space-between;align-items:center;background:var(--gold);color:var(--gold-ink);border:0;border-radius:16px;padding:14px 18px;font-weight:700;box-shadow:var(--shadow)}
.bar button .amt{font-family:var(--font-display);font-variant-numeric:tabular-nums;color:var(--gold-ink)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;overflow-y:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.sheet .in{max-width:680px;margin:0 auto}
.sheet h3{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--chip);border-radius:50%;width:36px;height:36px;font-size:18px}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg .pill{flex:1;text-align:center}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row .l{min-width:0}
.row .l small{color:var(--muted);display:block}
.sug{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.sug .pill{font-size:13px}
.total{display:flex;justify-content:space-between;font-family:var(--font-display);font-size:22px;padding:14px 0 6px;font-variant-numeric:tabular-nums}
.cta{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;margin-top:8px;text-align:center;text-decoration:none}
.cta.wa{background:linear-gradient(135deg,#5A3620,#3B2314);color:#FFF4E6;box-shadow:0 4px 18px rgba(59,35,20,.3);letter-spacing:.02em}
.cta.cp{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
.cta.ghost{background:var(--chip);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:80}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

  ta:{search:"மெனுவில் தேடுங்கள்",all:"அனைத்தும்",veg:"சைவம்",egg:"முட்டை",nonveg:"அசைவம்",add:"சேர்",none:"எந்த உணவும் கிடைக்கவில்லை.",
      items:function(n){return n+" உணவுகள்"},view:"ஆர்டரைப் பார்க்க",order:"உங்கள் ஆர்டர்",dine:"இங்கே சாப்பிட",take:"பார்சல்",
      table:"டேபிள் எண்",tableLabel:"டேபிள்",pickTable:"உங்கள் டேபிளைத் தேர்ந்தெடுக்கவும்",call:"பணியாளரை அழை",bill:"பில் வேண்டும்",svcHint:"WhatsApp திறக்கும். அனுப்பு என்பதை அழுத்தவும்.",name:"உங்கள் பெயர் (விருப்பம்)",note:"சமையலறைக்கு ஏதும் சொல்ல வேண்டுமா?",addons:"கூடுதலாக ஏதேனும்",total:"மொத்தம்",
      wa:"WhatsApp-இல் ஆர்டர் அனுப்பு",copy:"ஆர்டரை நகலெடு",clear:"ஆர்டரை அழி",copied:"ஆர்டர் நகலெடுக்கப்பட்டது",nocopy:"உரையைத் தேர்ந்து நகலெடுக்கவும்",
      foot:"புதியது · சுவையானது · எப்போதும் — நல்ல உணவு · நல்ல நேரம்",pay:"ஆர்டர் உறுதியான பிறகு கவுண்டரில் பணம் செலுத்துங்கள்.",lang:"English"}
};

var S = {lang:"en", diet:"all", q:"", cart:{}, open:false, type:"dine", table:"", tableLocked:false, name:"", note:""};
/* Each table has its own QR link ending in #table1 to #table4. The number from the link becomes the order's table. */
function readTable(){var m=/^#table([1-4])$/i.exec(location.hash||"");if(m){S.table=m[1];S.tableLocked=true;S.type="dine"}else{S.tableLocked=false}}
function renderTb(){var e=document.getElementById("tb");if(!e)return;e.hidden=!S.tableLocked;e.textContent=S.tableLocked?(T[S.lang].tableLabel+" "+S.table):"";
  var v=document.getElementById("svc");if(!v)return;v.hidden=!S.tableLocked;if(!S.tableLocked)return;
  var L=T[S.lang],c=document.getElementById("callBtn"),b=document.getElementById("billBtn");
  c.textContent=L.call;b.textContent=L.bill;document.getElementById("svcHint").textContent=L.svcHint;
  c.href="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent("*House of TJ* – Table "+S.table+": Please call the waiter.");
  b.href="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent("*House of TJ* – Table "+S.table+": Bill please.")}
readTable();
window.addEventListener("hashchange",function(){readTable();render()});
try{var sv=JSON.parse(localStorage.getItem("tj-menu")||"{}"); if(sv.lang)S.lang=sv.lang; if(sv.cart)S.cart=sv.cart;}catch(e){}
function save(){try{localStorage.setItem("tj-menu",JSON.stringify({lang:S.lang,cart:S.cart}))}catch(e){}}
function t(k){return T[S.lang][k]}
function byId(id){for(var i=0;i<ITEMS.length;i++)if(ITEMS[i].id===id)return ITEMS[i]}
function rupee(n){return "₹"+n}
function count(){var n=0;for(var k in S.cart)n+=S.cart[k];return n}
function total(){var n=0;for(var k in S.cart){var it=byId(k);if(it)n+=it.p*S.cart[k]}return n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dot(d){return d?'<span class="dot '+d+'" title="'+d+'"></span>':''}
function nm(it){return S.lang==="ta"?it.ta:it.en}
function alt(it){return S.lang==="ta"?it.en:it.ta}

function controls(it){
  var q=S.cart[it.id]||0;
  if(!q)return '<button class="add" type="button" data-act="inc" data-id="'+it.id+'">'+t("add")+'</button>';
  return '<div class="step"><button type="button" data-act="dec" data-id="'+it.id+'" aria-label="Remove one">−</button><b>'+q+'</b><button type="button" data-act="inc" data-id="'+it.id+'" aria-label="Add one">+</button></div>';
}
function matches(it){
  if(S.diet!=="all"&&it.d!==S.diet)return false;
  if(S.q){var s=(it.en+" "+it.ta).toLowerCase();if(s.indexOf(S.q.toLowerCase())<0)return false}
  return true;
}
function renderChips(){
  var h="";
  CATS.forEach(function(c,i){h+='<button class="chip" type="button" data-act="goto" data-id="'+c.id+'" id="chip-'+c.id+'"'+(i===0?' aria-current="true"':'')+'>'+esc(S.lang==="ta"?c.ta:c.en)+'</button>'});
  document.getElementById("chips").innerHTML=h;
  var d="";
  [["all",t("all"),""],["veg",t("veg"),"veg"],["egg",t("egg"),"egg"],["nonveg",t("nonveg"),"nonveg"]].forEach(function(x){
    d+='<button class="pill" type="button" data-act="diet" data-id="'+x[0]+'" aria-pressed="'+(S.diet===x[0])+'">'+(x[2]?'<span class="dot '+x[2]+'"></span>':'')+esc(x[1])+'</button>';
  });
  document.getElementById("diet").innerHTML=d;
  document.getElementById("q").placeholder=t("search");
  document.getElementById("langBtn").textContent=t("lang");
}
function renderMenu(){
  var h="",any=false;
  CATS.forEach(function(c){
    var rows=ITEMS.filter(function(i){return i.c===c.id&&matches(i)});
    if(!rows.length)return; any=true;
    h+='<section class="cat" id="cat-'+c.id+'" data-cat="'+c.id+'"><h2>'+esc(S.lang==="ta"?c.ta:c.en)+'</h2>'+(IMG[c.id]?'<img class="ban" src="'+IMG[c.id]+'" alt="'+esc(c.en)+'" width="720" height="327">':'')+'<div class="list">';
    rows.forEach(function(it){
      h+='<div class="item"><div class="name">'+dot(it.d)+'<span class="t">'+esc(nm(it))+(it.n?'<span class="note">('+esc(it.n)+')</span>':'')+(it.tag?'<span class="tag">'+esc(it.tag)+'</span>':'')+'</span></div>'
        +'<div class="alt">'+esc(alt(it))+'</div>'
        +'<div class="right"><span class="price">'+rupee(it.p)+'</span><span id="ctl-'+it.id+'">'+controls(it)+'</span></div></div>';
    });
    h+='</div></section>';
  });
  if(!any)h='<div class="empty">'+esc(t("none"))+'</div>';
  document.getElementById("menu").innerHTML=h;
}
function renderBar(){
  var n=count(), bar=document.getElementById("bar");
  bar.hidden=n===0||S.open;
  document.getElementById("barCount").textContent=t("view")+" · "+t("items")(n);
  document.getElementById("barAmt").textContent=rupee(total());
}
function orderText(){
  var lines=["*House of TJ* – "+(S.type==="dine"?"Dine-in"+(S.table?" · Table "+S.table:""):"Takeaway")];
  if(S.name)lines.push("Name: "+S.name);
  lines.push("");
  for(var k in S.cart){var it=byId(k);if(it)lines.push(S.cart[k]+" × "+it.en+(it.n?" ("+it.n+")":"")+" – "+rupee(it.p*S.cart[k]))}
  lines.push("","Total: "+rupee(total()));
  if(S.note)lines.push("Note: "+S.note);
  return lines.join("\n");
}
function renderSheet(){
  var L=document.getElementById("layer");
  if(!S.open){L.innerHTML="";return}
  var rows="";
  for(var k in S.cart){var it=byId(k);if(!it)continue;
    rows+='<div class="row"><div class="l"><b>'+esc(nm(it))+'</b><small>'+rupee(it.p)+(it.n?" · "+esc(it.n):"")+'</small></div>'
      +'<div class="step"><button type="button" data-act="dec" data-id="'+it.id+'" aria-label="Remove one">−</button><b>'+S.cart[k]+'</b><button type="button" data-act="inc" data-id="'+it.id+'" aria-label="Add one">+</button></div></div>';
  }
  var sug="";
  ITEMS.filter(function(i){return i.c==="addons"}).forEach(function(a){sug+='<button class="pill" type="button" data-act="inc" data-id="'+a.id+'">+ '+esc(nm(a))+' '+rupee(a.p)+(S.cart[a.id]?' ('+S.cart[a.id]+')':'')+'</button>'});
  var wa=WA_NUMBER?'<a class="cta wa" id="waBtn" href="#" target="_blank" rel="noopener">'+esc(t("wa"))+'</a>':'';
  L.innerHTML='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(t("order"))+'"><div class="in">'
    +'<h3><span>'+esc(t("order"))+'</span><button class="x" type="button" data-act="close" aria-label="Close">✕</button></h3>'
    +'<div class="seg"><button class="pill" type="button" data-act="type" data-id="dine" aria-pressed="'+(S.type==="dine")+'">'+esc(t("dine"))+'</button><button class="pill" type="button" data-act="type" data-id="take" aria-pressed="'+(S.type==="take")+'">'+esc(t("take"))+'</button></div>'
    +(S.type==="dine"?(S.tableLocked?'<div class="tbl">'+esc(t("tableLabel"))+' <b>'+esc(S.table)+'</b></div>':'<div class="hint">'+esc(t("pickTable"))+'</div><div class="seg">'+[1,2,3,4].map(function(n){return '<button class="pill" type="button" data-act="tbl" data-id="'+n+'" aria-pressed="'+(S.table==n)+'">'+n+'</button>'}).join("")+'</div>'):'')
    +'<input class="field" id="fName" placeholder="'+esc(t("name"))+'" value="'+esc(S.name)+'">'
    +rows
    +'<div class="hint" style="margin-top:12px">'+esc(t("addons"))+'</div><div class="sug">'+sug+'</div>'
    +'<input class="field" id="fNote" placeholder="'+esc(t("note"))+'" value="'+esc(S.note)+'">'
    +'<div class="total"><span>'+esc(t("total"))+'</span><span id="sheetTotal">'+rupee(total())+'</span></div>'
    +wa+'<button class="cta cp" type="button" data-act="copy">'+esc(t("copy"))+'</button>'
    +'<button class="cta ghost" type="button" data-act="clear">'+esc(t("clear"))+'</button>'
    +'<p class="hint">'+esc(t("pay"))+'</p>'
    +'<textarea id="copyBox" style="position:absolute;left:-9999px" readonly></textarea></div></div>';
  bindFields();
}
function bindFields(){
  var m={fTable:"table",fName:"name",fNote:"note"};
  Object.keys(m).forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener("input",function(){S[m[id]]=el.value;updWa()})});
  updWa();
}
function updWa(){var a=document.getElementById("waBtn");if(a)a.href="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(orderText())}
function toast(msg){var el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove()},1800)}
function refresh(){
  ITEMS.forEach(function(it){var el=document.getElementById("ctl-"+it.id);if(el)el.innerHTML=controls(it)});
  renderBar(); if(S.open){ if(!count()){S.open=false;renderSheet();renderBar()} else renderSheet()}
}
function render(){renderTb();renderChips();renderMenu();renderBar();renderSheet();document.documentElement.lang=S.lang==="ta"?"ta":"en";document.querySelector("[data-t=foot]").textContent=t("foot");observe()}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  if(a==="inc"){S.cart[id]=(S.cart[id]||0)+1;save();refresh()}
  else if(a==="dec"){var q=(S.cart[id]||0)-1;if(q<=0)delete S.cart[id];else S.cart[id]=q;save();refresh()}
  else if(a==="goto"){var el=document.getElementById("cat-"+id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="diet"){S.diet=id;renderChips();renderMenu();observe()}
  else if(a==="type"){S.type=id;renderSheet()}
  else if(a==="tbl"){S.table=id;renderSheet()}
  else if(a==="close"){S.open=false;renderSheet();renderBar()}
  else if(a==="clear"){S.cart={};save();S.open=false;refresh();renderSheet()}
  else if(a==="copy"){
    var txt=orderText(),box=document.getElementById("copyBox");
    var done=function(){toast(t("copied"))};
    var fb=function(){if(box){box.value=txt;box.style.left="0";box.style.position="static";box.style.width="100%";box.rows=6;box.select();toast(t("nocopy"))}};
    try{navigator.clipboard.writeText(txt).then(done,fb)}catch(err){fb()}
  }
});
document.getElementById("openCart").addEventListener("click",function(){S.open=true;renderSheet();renderBar()});
document.getElementById("q").addEventListener("input",function(e){S.q=e.target.value.trim();renderMenu();observe()});
document.getElementById("langBtn").addEventListener("click",function(){S.lang=S.lang==="en"?"ta":"en";save();render()});

var io=null;
function observe(){
  try{
    if(io)io.disconnect();
    io=new IntersectionObserver(function(es){
      es.forEach(function(en){if(en.isIntersecting){
        var id=en.target.getAttribute("data-cat");
        document.querySelectorAll(".chip").forEach(function(c){c.removeAttribute("aria-current")});
        var chip=document.getElementById("chip-"+id);
        if(chip){chip.setAttribute("aria-current","true");var box=document.getElementById("chips");box.scrollTo({left:chip.offsetLeft-16,behavior:"smooth"})}
      }});
    },{rootMargin:"-160px 0px -65% 0px"});
    document.querySelectorAll("section.cat").forEach(function(s){io.observe(s)});
  }catch(e){}
}
render();
</script>

</body></html>
